# XcodeGenのプロジェクト定義。
#
# .xcodeproj はマージ競合の温床（project.pbxproj が巨大な自動生成ファイル）なので、
# 人が読める定義をこのファイルに置き、プロジェクトは `xcodegen generate` で作る。
# 生成物は .gitignore している。

name: WhiskyCompass
options:
  bundleIdPrefix: app.whiskycompass
  deploymentTarget:
    # @Observable と NavigationStack を素直に使うため17を下限にする。
    # iOS 17未満のシェアは配信開始時点でごく小さい。
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # ⚠️ アーカイブ前に必ず設定すること。空のままだと署名できない。
    # 値は developer.apple.com/account → Membership details の Team ID（10文字）。
    # 秘密情報ではないのでコミットして構わない。
    DEVELOPMENT_TEAM: "3ZMWCRAFAG"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  WhiskyCompass:
    type: application
    platform: iOS
    sources:
      - path: WhiskyCompass
    # Info.plist は自動生成せず、構成ごとに切り替える（下の INFOPLIST_FILE）。
    # 開発用の平文HTTP例外をReleaseビルドに持ち込まないため。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.whiskycompass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone専用（1 = iPhone/iPod, 2 = iPad）。
        # iPadを名乗ると「iPadマルチタスク対応のため4方向すべてを許可すること」が
        # 必須になり（アップロード時に90474で弾かれる）、iPad用スクリーンショットと
        # 横向きレイアウトの検証も要る。UIはiPhone前提で作ってあるので専用にする。
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          # シミュレータはMacのネットワークをそのまま使うため、
          # Androidの 10.0.2.2 のような読み替えが要らず localhost で届く。
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # 平文HTTPの例外を持つのはこちらだけ。
          INFOPLIST_FILE: WhiskyCompass/Info-Debug.plist
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          INFOPLIST_FILE: WhiskyCompass/Info.plist

  WhiskyCompassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhiskyCompassTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WhiskyCompass

  # 画面を実際に操作して確認するためのUIテスト。
  # ローカルのDjango(localhost:8000)が起動していることが前提。
  WhiskyCompassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WhiskyCompassUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WhiskyCompass
